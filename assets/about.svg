<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 464" width="1000" height="464" role="img" aria-label="Our mission: eliminate manual work, unlock AI speed. Up to 70% less time on repetitive tasks, up to 40% lower operating costs, up to 3x faster customer response (illustrative, not guaranteed).">
  <defs>
    <clipPath id="win"><rect x="1" y="1" width="998" height="462" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0.92" cy="0" r="0.75">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4444"/><stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FFFFFF" fill-opacity="0.025"/></pattern>
    <style>
  .m { font-family: 'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace; }
  .fi { animation: fi .5s ease-out both; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  </defs>
  <g clip-path="url(#win)">
    <rect width="1000" height="464" fill="#0B0B10"/>
    <rect width="1000" height="464" fill="url(#glow)"/>
    <rect width="1000" height="464" fill="url(#scan)"/>
    <rect width="1000" height="42" fill="#15151C"/>
    <path d="M0 42.5 H1000" stroke="#2A2A33"/>
    <circle cx="26" cy="21" r="6.5" fill="#DC2626"/><circle cx="48" cy="21" r="6.5" fill="#3F3F46"/><circle cx="70" cy="21" r="6.5" fill="#3F3F46"/>
    <text class="m" x="500.0" y="26" font-size="14" fill="#71717A" text-anchor="middle">~/about</text>
    <clipPath id="t2"><rect x="178.4" y="74" width="900" height="27.0">
      <animate attributeName="width" dur="1.07s" fill="freeze" calcMode="discrete" values="0;0.0;10.8;21.6;32.4;43.2;54.0;64.8;75.6;86.4;97.2;108.0;118.8;129.6;140.4;900" keyTimes="0;0.2804;0.3318;0.3832;0.4346;0.4860;0.5374;0.5888;0.6402;0.6916;0.7430;0.7944;0.8458;0.8972;0.9486;1"/>
    </rect></clipPath>
    <text class="m" x="40" y="92" font-size="18" font-weight="700"><tspan fill="#EF4444">hadesflow</tspan><tspan fill="#71717A">:~$</tspan></text>
    <text class="m" x="180.4" y="92" font-size="18" fill="#F4F4F5" clip-path="url(#t2)">cat mission.md</text>
    <g class="fi" style="animation-delay:1.17s">
      <text class="m" x="40" y="146" font-size="28" font-weight="800" fill="#F4F4F5" text-anchor="start"><tspan fill="#EF4444"># </tspan>Eliminate manual work. Unlock AI speed.</text>
      <text class="m" x="40" y="188" font-size="17" font-weight="400" fill="#A1A1AA" text-anchor="start">We eliminate repetitive work so your team can focus on what truly matters:</text>
      <text class="m" x="40" y="214" font-size="17" font-weight="400" fill="#A1A1AA" text-anchor="start">innovation, creativity and growth - through custom software, AI automations,</text>
      <text class="m" x="40" y="240" font-size="17" font-weight="400" fill="#A1A1AA" text-anchor="start">AI services and hands-on training.</text>
    </g>
    <g class="fi" style="animation-delay:1.77s">
      <text class="m" x="40" y="294" font-size="13" font-weight="400" fill="#71717A" text-anchor="start">metric</text>
      <text class="m" x="330" y="294" font-size="13" font-weight="400" fill="#71717A" text-anchor="start">before <tspan fill="#3F3F46">■</tspan>   after <tspan fill="#DC2626">■</tspan></text>
      <text class="m" x="40" y="328" font-size="17" font-weight="400" fill="#F4F4F5" text-anchor="start">time on repetitive tasks</text>
      <rect x="330" y="315" width="420" height="14" rx="3" fill="#27272A"/>
      <rect x="330" y="315" width="126" height="14" rx="3" fill="url(#red)">
        <animate attributeName="width" dur="3.27s" fill="freeze" values="420;420;126" keyTimes="0;0.664;1" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1"/>
      </rect>
      <text class="m" x="960" y="328" font-size="17" font-weight="700" fill="#EF4444" text-anchor="end">up to -70%</text>
      <text class="m" x="40" y="362" font-size="17" font-weight="400" fill="#F4F4F5" text-anchor="start">operating costs</text>
      <rect x="330" y="349" width="420" height="14" rx="3" fill="#27272A"/>
      <rect x="330" y="349" width="252" height="14" rx="3" fill="url(#red)">
        <animate attributeName="width" dur="3.52s" fill="freeze" values="420;420;252" keyTimes="0;0.688;1" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1"/>
      </rect>
      <text class="m" x="960" y="362" font-size="17" font-weight="700" fill="#EF4444" text-anchor="end">up to -40%</text>
      <text class="m" x="40" y="396" font-size="17" font-weight="400" fill="#F4F4F5" text-anchor="start">customer response time</text>
      <rect x="330" y="383" width="420" height="14" rx="3" fill="#27272A"/>
      <rect x="330" y="383" width="139" height="14" rx="3" fill="url(#red)">
        <animate attributeName="width" dur="3.77s" fill="freeze" values="420;420;139" keyTimes="0;0.708;1" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1"/>
      </rect>
      <text class="m" x="960" y="396" font-size="17" font-weight="700" fill="#EF4444" text-anchor="end">up to 3x faster</text>
    </g>
    <g class="fi" style="animation-delay:2.07s">
      <text class="m" x="40" y="440" font-size="13" font-weight="400" fill="#71717A" text-anchor="start"># illustrative potential based on typical projects - actual results vary and are not guaranteed</text>
    </g>

  </g>
  <rect x="1" y="1" width="998" height="462" rx="14" fill="none" stroke="#2A2A33" stroke-width="1.5"/>
</svg>
