<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 60" width="420" height="60" role="img" aria-label="book a free consultation">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EF4444"/><stop offset="1" stop-color="#B91C1C"/></linearGradient>
    <style>
  .m { font-family: 'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace; }
  .fi { animation: fi .5s ease-out both; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  </defs>
  <rect x="1" y="1" width="418" height="58" rx="10" fill="url(#red)" stroke="none" stroke-width="2"/>
  <text class="m" x="210.0" y="37.0" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan fill="#FFFFFF">&gt; </tspan>book a free consultation<tspan class="blink" fill="#FFFFFF">_</tspan></text>
</svg>
