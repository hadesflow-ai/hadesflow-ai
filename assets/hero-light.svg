<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="HadesFlow: We automate the work. Then we keep it running.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#FEF2F2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.45">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <style>
      .f { font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
      .dot { animation: travel 2.4s cubic-bezier(.45,0,.25,1) infinite; }
            .ring { animation: ring 2.4s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 70%,100% { transform: scale(1.55); opacity: 0; } }
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 82% { transform: translateX(372px); opacity: 1; } 90%,100% { transform: translateX(372px); opacity: 0; } }
      @keyframes ring { 0%,78%,100% { fill-opacity: .14; } 86% { fill-opacity: .4; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .dot { animation: none; opacity: 0; }
        .ring { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#glow)"/>

  <!-- headline -->
  <text class="f" x="600" y="112" font-size="56" font-weight="800" fill="#18181B" text-anchor="middle">We automate the work.</text>
  <text class="f" x="600" y="180" font-size="56" font-weight="800" fill="#DC2626" text-anchor="middle">Then we keep it running.</text>

  <!-- manual work: a tangled line -->
  <path d="M150 300 C180 250 215 250 230 290 C245 330 205 345 200 310 C195 270 270 250 300 300 C325 340 360 330 370 300 C385 255 430 250 445 290 C455 320 420 330 425 300 C430 270 500 290 564 300"
        fill="none" stroke="#A1A1AA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- HadesFlow node: three heads -->
  <rect class="pulse" x="564" y="264" width="72" height="72" rx="20" fill="none" stroke="#DC2626" stroke-width="3"/>
  <rect x="564" y="264" width="72" height="72" rx="20" fill="url(#red)"/>
  <g fill="#FFFFFF"><circle cx="582" cy="300" r="7"/><circle cx="600" cy="300" r="7"/><circle cx="618" cy="300" r="7"/></g>

  <!-- the flow: one straight line -->
  <path d="M636 300 H1022" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
  <circle class="dot" cx="644" cy="300" r="8" fill="#FCA5A5" stroke="#DC2626" stroke-width="3"/>

  <!-- done -->
  <circle class="ring" cx="1050" cy="300" r="28" fill="#DC2626" fill-opacity=".14" stroke="#DC2626" stroke-width="4"/>
  <path d="M1038 301 L1047 310 L1063 291" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- signature -->
  <text class="f" x="1150" y="408" font-size="20" font-weight="500" fill="#52525B" text-anchor="end"><tspan font-weight="800" fill="#18181B">HadesFlow</tspan>  ·  Sofia, Bulgaria</text>

  <!-- AI-generated image marker -->
  <g class="f">
    <circle cx="60" cy="398" r="24" fill="#18181B" fill-opacity="0.07" stroke="#18181B" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M49 392 L50.9 396.1 L55 398 L50.9 399.9 L49 404 L47.1 399.9 L43 398 L47.1 396.1 Z" fill="#18181B" fill-opacity="0.9"/>
    <text x="57" y="404" font-size="16" font-weight="700" fill="#18181B" fill-opacity="0.9">AI</text>
  </g>
</svg>
