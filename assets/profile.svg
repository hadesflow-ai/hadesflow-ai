    <style>
  .m { font-family: 'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace; }
  .s { font-family: system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .fi { animation: fi .6s ease-out both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
  .dot { animation: travel 2.4s cubic-bezier(.45,0,.25,1) infinite; }
  .ring { animation: ring 2.4s ease-out infinite; }
  @keyframes fi { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: 0; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(1.55); opacity: 0; } }
  @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 82% { transform: translateX(372px); opacity: 1; } 90%, 100% { transform: translateX(372px); opacity: 0; } }
  @keyframes ring { 0%, 78%, 100% { fill-opacity: .14; } 86% { fill-opacity: .4; } }
  .prog { transform-box: fill-box; transform-origin: left center; animation: prog 7.0s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 5.18s; }
  @keyframes prog { 0% { transform: scaleX(0); } 70%, 92% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  .n0 { animation: n0 7.0s linear infinite; animation-delay: 5.18s; }
  @keyframes n0 { 0%, 0.0% { fill: #0B0B10; } 0.0%, 92% { fill: #DC2626; } 100% { fill: #0B0B10; } }
  .n1 { animation: n1 7.0s linear infinite; animation-delay: 5.18s; }
  @keyframes n1 { 0%, 17.4% { fill: #0B0B10; } 17.5%, 92% { fill: #DC2626; } 100% { fill: #0B0B10; } }
  .n2 { animation: n2 7.0s linear infinite; animation-delay: 5.18s; }
  @keyframes n2 { 0%, 34.9% { fill: #0B0B10; } 35.0%, 92% { fill: #DC2626; } 100% { fill: #0B0B10; } }
  .n3 { animation: n3 7.0s linear infinite; animation-delay: 5.18s; }
  @keyframes n3 { 0%, 52.4% { fill: #0B0B10; } 52.5%, 92% { fill: #DC2626; } 100% { fill: #0B0B10; } }
  .n4 { animation: n4 7.0s linear infinite; animation-delay: 5.18s; }
  @keyframes n4 { 0%, 69.9% { fill: #0B0B10; } 70.0%, 92% { fill: #DC2626; } 100% { fill: #0B0B10; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
